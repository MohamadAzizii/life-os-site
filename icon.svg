<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#23805f"/>
      <stop offset="1" stop-color="#134836"/>
    </linearGradient>
    <clipPath id="above"><rect x="0" y="0" width="512" height="250"/></clipPath>
  </defs>
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <!-- the sun rising: "Today" -->
  <circle cx="256" cy="250" r="96" fill="#f6d98b" clip-path="url(#above)"/>
  <!-- horizon -->
  <line x1="112" y1="258" x2="400" y2="258" stroke="#fffaf0" stroke-width="18" stroke-linecap="round"/>
  <!-- the list of what's next -->
  <line x1="156" y1="318" x2="356" y2="318" stroke="#fffaf0" stroke-opacity=".72" stroke-width="18" stroke-linecap="round"/>
  <line x1="196" y1="372" x2="316" y2="372" stroke="#fffaf0" stroke-opacity=".45" stroke-width="18" stroke-linecap="round"/>
</svg>
